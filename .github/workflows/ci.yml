name: CI
on: [push,pull_request]
jobs:
  test:
    # Pinned: ubuntu-latest is now 26.04, which Playwright 1.58 cannot install browsers on.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck:packages
      - run: npm run typecheck -w @ai-voiceover/web
      - run: npm run typecheck:test -w @ai-voiceover/web
      - run: npm test -w @ai-voiceover/web -- --coverage
      - run: npm run lint -w @ai-voiceover/web
      - run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - name: E2E API health smoke
        run: npm run e2e:api
  voice-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -r services/xtts/requirements-dev.txt
      - run: python -m pytest -q services/xtts/tests
