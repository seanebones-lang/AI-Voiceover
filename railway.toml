# Railway deployment config (single Next.js service)
# See .railway/env.template for required/optional env vars.
# Dockerfile is used when present; health check fails (503) when XTTS is configured but unhealthy.
# For persistent cloned voices, add a volume in Railway dashboard and set VOICES_DIR to the mount path.

[build]
builder = "DOCKERFILE"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
