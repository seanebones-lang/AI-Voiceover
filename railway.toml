[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "/docker-entrypoint.sh"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[services]]
name = "ai-voiceover"
port = 3000

[[services]]
name = "xtts-sidecar"
port = 8000

[env]
NODE_ENV = "production"
PORT = "3000"
XTTS_SIDECAR_URL = "http://localhost:8000"
