# HumanMirage TTS - Docker Compose Configuration
# Production deployment with GPU support

version: '3.8'

services:
  # Main TTS Service
  tts:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: humanmirage-tts
    ports:
      - "8082:8082"
    volumes:
      # Persist speaker database
      - tts_data:/app/data
      # Mount models directory (optional, for custom models)
      - ./models:/app/models:ro
    environment:
      - TTS_PORT=8082
      - CUDA_VISIBLE_DEVICES=0
      - TTS_MODEL=tts_models/multilingual/multi-dataset/xtts_v2
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  # Optional: Redis for caching (improves latency for repeated texts)
  redis:
    image: redis:7-alpine
    container_name: humanmirage-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  tts_data:
  redis_data:

networks:
  default:
    name: humanmirage-network
